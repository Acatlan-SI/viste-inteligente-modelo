steps:
  # Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'northamerica-south1-docker.pkg.dev/viste-inteligente/ml-service-repo/ml-service:latest', '.']
  
  # Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'northamerica-south1-docker.pkg.dev/viste-inteligente/ml-service-repo/ml-service:latest']
  
  # Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ml-service'
      - '--image=northamerica-south1-docker.pkg.dev/viste-inteligente/ml-service-repo/ml-service:latest'
      - '--region=northamerica-south1'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCS_BUCKET_NAME=viste-inteligente-bucket'

images:
  - 'northamerica-south1-docker.pkg.dev/viste-inteligente/ml-service-repo/ml-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY