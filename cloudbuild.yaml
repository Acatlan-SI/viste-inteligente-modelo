steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ml-service:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ml-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ml-service'
      - '--image=gcr.io/$PROJECT_ID/ml-service:latest'
      - '--region=northamerica-south1'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCS_BUCKET_NAME=viste-inteligente-bucket'

images:
  - 'gcr.io/$PROJECT_ID/ml-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY